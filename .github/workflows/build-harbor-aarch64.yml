name: Build Harbor Aarch64
on:
  push:
    branches: [ main ]
  tags:
    - 'v*'

jobs:
  build-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    env:
      Harbor_Git_Tag: 'v2.15.2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Package Harbor (v2.15.2 test build)
        run: |
          bash build-harbor-aarch64.sh
          docker images
          mkdir -p all-in-one/harbor
          # goharbor 是新仓库地址，vmware/harbor 归档，高版本会404
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/LICENSE -o all-in-one/harbor/LICENSE
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/common.sh -o all-in-one/harbor/common.sh
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/harbor.yml.tmpl -o all-in-one/harbor/harbor.yml.tmpl
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/install.sh -o all-in-one/harbor/install.sh
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/prepare -o all-in-one/harbor/prepare
          sed -i "s#goharbor/prepare:dev#goharbor/prepare:${Harbor_Git_Tag}-aarch64#g" all-in-one/harbor/prepare
          docker save $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^goharbor/"| grep "\-aarch64") | gzip > all-in-one/harbor/harbor.${Harbor_Git_Tag}.tar.gz
          cd all-in-one
          chmod +x harbor/prepare harbor/install.sh
          tar zcf harbor-offline-installer-aarch64.tgz harbor
          rm -rf harbor
          docker build -t alanpeng/harbor_images_aarch64:${Harbor_Git_Tag} .

      - name: Login DockerHub & Push Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          docker push alanpeng/harbor_images_aarch64:${Harbor_Git_Tag}

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-offline-${{ env.Harbor_Git_Tag }}
          path: all-in-one/harbor-offline-installer-aarch64.tgz

  build-tags:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    env:
      # 重点修复：从git tag自动获取版本，不再硬编码v2.13.0！
      Harbor_Git_Tag: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Package Harbor (Tag release build)
        run: |
          bash build-harbor-aarch64.sh
          docker images
          mkdir -p all-in-one/harbor
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/LICENSE -o all-in-one/harbor/LICENSE
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/common.sh -o all-in-one/harbor/common.sh
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/harbor.yml.tmpl -o all-in-one/harbor/harbor.yml.tmpl
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/install.sh -o all-in-one/harbor/install.sh
          curl -L https://raw.githubusercontent.com/goharbor/harbor/${Harbor_Git_Tag}/make/prepare -o all-in-one/harbor/prepare
          sed -i "s#goharbor/prepare:dev#goharbor/prepare:${Harbor_Git_Tag}-aarch64#g" all-in-one/harbor/prepare
          docker save $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^goharbor/"| grep "\-aarch64") | gzip > all-in-one/harbor/harbor.${Harbor_Git_Tag}.tar.gz
          cd all-in-one
          chmod +x harbor/prepare harbor/install.sh
          tar zcf harbor-offline-installer-aarch64.tgz harbor
          rm -rf harbor
          docker build -t alanpeng/harbor_images_aarch64:${Harbor_Git_Tag} .

      - name: Login DockerHub & Push Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          docker push alanpeng/harbor_images_aarch64:${Harbor_Git_Tag}

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-offline-${{ env.Harbor_Git_Tag }}
          path: all-in-one/harbor-offline-installer-aarch64.tgz

      # 可选新增：自动创建GitHub Release并上传离线包
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Harbor ${{ env.Harbor_Git_Tag }} aarch64 offline installer
          files: all-in-one/harbor-offline-installer-aarch64.tgz
          generate_release_notes: true
